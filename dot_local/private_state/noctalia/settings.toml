config_version = 12

[bar.default]
center = [ "clock", "audio_visualizer" ]
font_family = "Monofur Nerd Font"
position = "bottom"
start = [ "workspaces", "launcher", "wallpaper", "cpu" ]
thickness = 40

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
media = false

[shell]
font_family = "Monofur Nerd Font"

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
directory = "/home/sakthi/Pictures/Wallpapers"
fill_mode = "fit"

    [wallpaper.default]
    path = "/home/sakthi/Pictures/Wallpapers/dominik-mayer-24.jpg"

    [wallpaper.last]
    path = "/home/sakthi/Pictures/Wallpapers/dominik-mayer-24.jpg"